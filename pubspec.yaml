name: goride_rider_app
description: "GoRide — app de pasajeros (Android)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado / navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0

  # Red
  dio: ^5.4.3+1

  # Sesión segura (token Bearer)
  flutter_secure_storage: ^9.2.2

  # Mapa y ubicación
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # Documentos legales dentro de la app
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0

  equatable: ^2.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
